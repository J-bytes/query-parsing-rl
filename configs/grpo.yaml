# Stage 3: GRPO (from-scratch implementation) from the SFT checkpoint.
seed: 0
task: query_parsing
init_model: runs/sft/best
dtype: fp32
precision: bf16-mixed
gradient_checkpointing: true
output_dir: runs/grpo
max_completion_tokens: 96
# --- rollouts ---
prompts_per_step: 16        # P
num_generations: 8          # G; P*G = 128 completions per step
temperature: 1.0
top_p: 1.0
max_batches: 300            # rollout batches; optimizer steps = max_batches * num_iterations
# --- loss ---
num_iterations: 2           # mu: optimisation passes per rollout batch (>1 makes clipping active)
micro_batch_size: 16        # completions per forward/backward
epsilon_low: 0.2
epsilon_high: 0.28          # "clip-higher" (DAPO): more room to raise low-prob tokens
beta: 0.02                  # k3 KL to the SFT reference; 0 disables the reference model
kl_ratio_correction: false   # TRL's use_bias_correction_kl; only matters when num_iterations > 1
loss_aggregation: dapo      # grpo | bnpo | dapo | dr_grpo
advantage_scale: group      # group | batch | none (Dr. GRPO)
mask_truncated_completions: true
log_rollouts_every: 10
optim:
  optimizer: adamw
  lr: 1.0e-6
  weight_decay: 0.0
  warmup_steps: 10
  lr_schedule: constant
  grad_clip: 1.0
data:
  pool: data/processed/grpo.jsonl
  max_pool: null
  dev: data/processed/dev.jsonl
eval:
  num_dev: 300
  every_n_steps: 50         # optimizer steps (= 25 rollout batches at mu=2)
  batch_size: 64
  monitor: micro_f1
reward:
  w_f1: 1.0
  w_format: 0.2
